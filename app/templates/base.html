<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyGymApp Dashboard{% endblock %}</title>
  <script src="/static/chart.umd.min.js"></script>
  <script src="/static/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e6e8ec;
      --muted: #8b93a7;
      --accent: #5b9dff;
      --green: #3ecf7e;
      --yellow: #e0b23e;
      --red: #e05a5a;
      --gray: #4a5063;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    nav {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 4cm;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover, nav a.active { color: var(--text); }
    nav .brand { color: var(--text); font-weight: 700; margin-right: auto; }
    main {
      margin: 0 auto;
      padding: 2rem 4cm;
    }
    h1 { font-size: 2.75rem; margin: 0 0 0.25rem; text-align: center; }
    h2 { font-size: 1.3rem; margin: 3rem 0 0.25rem; font-weight: 700; }
    h2.section-title {
      font-size: 2.25rem;
      text-align: center;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    h3 { font-size: 1.1rem; margin: 2rem 0 1rem; color: var(--muted); font-weight: 600; }
    .section-desc, .chart-desc {
      color: var(--muted);
      font-size: 0.88rem;
      margin: 0 0 1rem;
      max-width: 65ch;
    }
    .chart-desc { margin-bottom: 0.75rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    @media (max-width: 460px) {
      .grid { grid-template-columns: 1fr; }
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }
    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 460px) {
      .grid-4 { grid-template-columns: 1fr; }
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0 0 1.5rem;
      justify-content: center;
    }
    .legend .dot { margin-right: 0.35rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .metric-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .metric-value {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0.25rem 0;
    }
    .metric-delta { font-size: 0.85rem; color: var(--muted); }
    .dot {
      display: inline-block;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      margin-right: 0.4rem;
    }
    .dot.GREEN { background: var(--green); }
    .dot.YELLOW { background: var(--yellow); }
    .dot.RED { background: var(--red); }
    .dot.GRAY { background: var(--gray); }
    .dot.BLUE { background: var(--accent); }
    .dot.PURPLE { background: #c77dff; }
    .readiness-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 1.25rem;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 0.75rem 0 0;
    }
    .alerts {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0;
    }
    .alerts li {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--yellow);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    @media (max-width: 700px) {
      .chart-grid { grid-template-columns: 1fr; }
    }
    .chart-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.518rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
      text-align: center;
    }
    .chart-direction {
      font-size: 0.85rem;
      letter-spacing: -0.05em;
      color: var(--muted);
    }
    /* ~65% opacity — colored enough to read as good/bad at a glance
       without competing with the chart title next to it. */
    .chart-direction-up { color: var(--green); opacity: 0.65; }
    .chart-direction-down { color: var(--red); opacity: 0.65; }
    .chart-canvas-box {
      position: relative;
      flex: 1;
      /* Fixed minimum height on the canvas's own box, not the <canvas>
         element, since Chart.js with responsive:true resizes the canvas to
         fill its container — sizing only the canvas's height attribute gets
         overridden and ignored. */
      min-height: 280px;
    }
    .chart-canvas-box canvas {
      max-height: 100%;
    }
    .chart-no-data {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    a.row-link { color: var(--text); text-decoration: none; display: block; }
    .empty { color: var(--muted); font-style: italic; padding: 2rem; text-align: center; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .page-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">MyGymApp</span>
    <a href="/">Trends</a>
    <a href="/exercises">Exercises</a>
    <a href="/weekly-report">🔔 Genera notifica settimanale</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Shared chart helpers: ISO date -> "W20" (ISO week-of-year) or "Aug"
    // (abbreviated month name), plus a common lineChart() builder. Data
    // stays plain ISO dates end to end (from Python through the template);
    // this is purely a display-time relabeling of the x-axis.
    const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function isoWeekLabel(dateStr) {
      // ISO 8601 week number: the week containing the year's first Thursday is week 1.
      const d = new Date(dateStr + "T00:00:00Z");
      const dayNum = (d.getUTCDay() + 6) % 7; // Mon=0 .. Sun=6
      d.setUTCDate(d.getUTCDate() - dayNum + 3); // nearest Thursday
      const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
      const firstThursdayDay = (firstThursday.getUTCDay() + 6) % 7;
      firstThursday.setUTCDate(firstThursday.getUTCDate() - firstThursdayDay + 3);
      const weekNum = 1 + Math.round((d - firstThursday) / (7 * 86400000));
      return "W" + weekNum;
    }

    function monthLabel(dateStr) {
      const d = new Date(dateStr + "T00:00:00Z");
      return MONTH_ABBR[d.getUTCMonth()];
    }

    function dayMonthLabel(dateStr) {
      const d = new Date(dateStr + "T00:00:00Z");
      return d.getUTCDate() + " " + MONTH_ABBR[d.getUTCMonth()];
    }

    function formatLabels(dates, mode) {
      if (mode === "week") return dates.map(isoWeekLabel);
      if (mode === "month") return dates.map(monthLabel);
      if (mode === "date") return dates.map(dayMonthLabel);
      return dates;
    }

    const CHART_OPTIONS = {
      responsive: true,
      // Without this, Chart.js locks to a 2:1 aspect ratio and ignores the
      // wrapper's actual height — the real cause of "chart is too flat"
      // regardless of how tall .chart-wrap is set. false lets the canvas
      // fill its container's height exactly.
      maintainAspectRatio: false,
      // Disabled rather than left to run: an in-progress entry animation
      // (points sliding in from a compressed starting layout) was caught
      // mid-flight by an automated screenshot and looked like a genuine
      // layout bug — real browsers finish it in well under a second, but
      // there's no upside to an animation here (this is historical data,
      // not a live-updating value) and it removes any chance of a chart
      // reading as "broken" during that window.
      animation: false,
      // Extra left padding so thresholdGlyphPlugin's glyph (drawn just left
      // of the y-axis's own tick-label column, see below) has room to
      // render instead of being squeezed against — or clipped by — the
      // canvas edge.
      layout: { padding: { left: 14 } },
      // Legend is redundant now that every chart has its own <h4> title
      // above it (single-series charts) or an explicit dataset label already
      // conveyed by the section around it — dropped in favor of that,
      // rather than a legend duplicating the same name inside the canvas.
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b93a7" }, grid: { color: "#262b36" } },
        y: { ticks: { color: "#8b93a7" }, grid: { color: "#262b36" } },
      },
    };

    // Points need to read as distinct dots, not just a kink in the line —
    // larger radius + a darker/lighter point color than the line itself
    // (not just the same color at full opacity) so the eye catches
    // individual data points even on a dense series.
    const POINT_RADIUS = 4;
    const POINT_HOVER_RADIUS = 6;

    // Least-squares linear regression over the whole series (x = point
    // index, skipping null/undefined values), returned as one y value per
    // original index — a single straight trend line across the full
    // range, not a per-point smoothing. null input (fewer than 2 usable
    // points — no line is determined by 0 or 1 point) returns an
    // all-null array so the caller can skip drawing it.
    function linearRegressionLine(values) {
      const points = values
        .map((v, i) => [i, v])
        .filter(([, v]) => v !== null && v !== undefined);
      if (points.length < 2) return values.map(() => null);

      const n = points.length;
      const sumX = points.reduce((s, [x]) => s + x, 0);
      const sumY = points.reduce((s, [, y]) => s + y, 0);
      const sumXY = points.reduce((s, [x, y]) => s + x * y, 0);
      const sumXX = points.reduce((s, [x]) => s + x * x, 0);
      const denom = n * sumXX - sumX * sumX;
      // denom is 0 only if every point shares the same x — impossible here
      // since x is the distinct point index, so no guard needed beyond the
      // n < 2 check above.
      const slope = (n * sumXY - sumX * sumY) / denom;
      const intercept = (sumY - slope * sumX) / n;

      return values.map((_, i) => slope * i + intercept);
    }

    // Reference-line glyphs, plain Unicode geometric shapes (not emoji —
    // these have no emoji presentation form, so they render as text glyphs
    // in every font/OS rather than a colored pictograph). Both severities
    // use the same filled ▲ — color (yellow vs red) is what distinguishes
    // them, same vocabulary as the semaphore dots elsewhere, not shape.
    // "info" is a third severity for multi-level scales (e.g. VO2max's
    // ACSM Poor/Fair/Average/Good/Excellent/Superior) where most boundaries
    // are just informative stage markers, not a problem — only the
    // lowest-tier boundary is realistically a "warning".
    const THRESHOLD_GLYPH = { warning: "▲", danger: "▲", info: "▲" };
    const THRESHOLD_COLOR = { warning: "#e0b23e", danger: "#e05a5a", info: "#8b93a7" };

    // Draws each chart's threshold glyphs directly on the canvas 2D
    // context, positioned just left of the y-axis like an axis tick.
    //
    // Why not chartjs-plugin-annotation's own "label" annotation type for
    // this: extensive testing (xValue/xScaleID combinations, clip: false,
    // drawTime: 'afterDraw', larger layout.padding.left) never got a label
    // annotation to render once xAdjust pushed it left of chartArea.left —
    // it silently disappears regardless of clip/drawTime settings, which
    // isn't documented behavior. This custom afterDraw plugin reliably
    // works (verified visually) because it draws directly via fillText
    // rather than going through the annotation plugin's own layout/clip
    // pipeline. The dashed reference *line* itself still uses
    // chartjs-plugin-annotation (that part works fine) — only the glyph
    // moved to this custom plugin.
    const thresholdGlyphPlugin = {
      id: "thresholdGlyphs",
      afterDraw(chart) {
        const glyphs = chart.config.options.thresholdGlyphs;
        if (!glyphs || !glyphs.length) return;
        const ctx = chart.ctx;
        const yScale = chart.scales.y;
        ctx.save();
        // Bold + larger than the axis's own tick-label font (which is
        // ~11-12px, muted gray) so the glyph reads as a distinct colored
        // marker at a glance instead of blending into the tick labels.
        ctx.font = "bold 16px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (const g of glyphs) {
          // g came from dashboard.html's THRESHOLDS table, which only
          // carries {value, severity, label} — color is derived from
          // severity here (previously read a non-existent g.color, which
          // silently left fillStyle at whatever it last was, rendering the
          // glyph in the wrong — barely visible — color).
          ctx.fillStyle = THRESHOLD_COLOR[g.severity];
          // yScale.left is where the axis's own tick labels ("60", "100",
          // etc) start — chartArea.left is further right, past those
          // labels. Anchoring off chartArea.left put the glyph *on top of*
          // the tick label text (same muted gray, easy to miss); yScale.left
          // - 8 puts it just left of the numbers instead, clear of them.
          ctx.fillText(THRESHOLD_GLYPH[g.severity], yScale.left - 8, yScale.getPixelForValue(g.value));
        }
        ctx.restore();
      },
    };
    Chart.register(thresholdGlyphPlugin);

    // Builds one chartjs-plugin-annotation line entry for a threshold:
    // { value, severity: "warning"|"danger", label } — the dashed
    // reference line with its description text (the glyph is drawn
    // separately, see thresholdGlyphPlugin above).
    function thresholdLine(threshold, index) {
      const color = THRESHOLD_COLOR[threshold.severity];
      return {
        [`thresholdLine${index}`]: {
          type: "line",
          yMin: threshold.value,
          yMax: threshold.value,
          borderColor: color,
          borderWidth: 1,
          borderDash: [5, 4],
          label: {
            display: true,
            content: threshold.label,
            position: "start",
            backgroundColor: "transparent",
            color: color,
            font: { size: 10, weight: "normal" },
            padding: 0,
            yAdjust: -8,
          },
        },
      };
    }

    // Builds one chartjs-plugin-annotation "box" entry for a shaded
    // background range: { min, max, color } — e.g. Poincaré ratio's
    // 1.5-4.5 "optimal" band (ANALYSIS_SPEC.md §11.1's GREEN cutoff).
    // Uses the annotation plugin's box type (not the custom canvas plugin
    // used for glyphs) since a plain rectangle has none of the "label"
    // type's positioning bugs found earlier — box annotations are simple
    // geometry, not text layout.
    function thresholdBand(band, index) {
      return {
        [`thresholdBand${index}`]: {
          type: "box",
          yMin: band.min,
          yMax: band.max,
          backgroundColor: band.color + "26",
          borderWidth: 0,
        },
      };
    }

    // labelMode: "week" -> "W20", "month" -> "Aug", anything else -> raw ISO date.
    // series: a single {label, values, color, fill?} or an array of them for
    // a multi-dataset chart (see the two-series body-composition chart).
    // fill: omitted/false for a plain line, "start"/"end" to shade the area
    // between the line and the chart's bottom/top edge (Chart.js fill modes).
    // thresholds: optional array of {value, severity, label} reference lines
    // (see docs/sync-ingestion/ANALYSIS_SPEC.md and the sources cited in
    // dashboard.html's THRESHOLDS table for where each cutoff comes from).
    // bands: optional array of {min, max, color} shaded background ranges
    // (e.g. Poincaré ratio's optimal-range band).
    // Chart.js auto-scales the y-axis to fit *everything* it draws,
    // including threshold lines/bands — so a "Poor < 25" reference line on
    // a VO2max chart whose real values sit at 40-45 forces the axis down to
    // 25, squeezing an otherwise-flat real series into the top sliver of
    // the chart. Computing min/max from the actual data (with a margin)
    // and setting them explicitly keeps the real series roughly centered;
    // threshold lines/bands outside that range just don't show (correct —
    // they're not relevant to this data), rather than distorting the scale
    // to fit them.
    function dataDrivenYRange(seriesList) {
      const values = seriesList.flatMap(s => s.values).filter(v => v !== null && v !== undefined);
      if (!values.length) return {};
      const min = Math.min(...values);
      const max = Math.max(...values);
      if (min === max) {
        // Flat/single-point series: pad by a fixed amount rather than a
        // percentage of a zero range.
        return { min: min - 5, max: max + 5 };
      }
      const margin = (max - min) * 0.15;
      return { min: min - margin, max: max + margin };
    }

    // yRange: optional explicit {min, max} overriding dataDrivenYRange —
    // for charts like body composition where the axis has to stay fixed
    // (0-100%) for an above/below fill split to mean anything, rather than
    // auto-zooming to wherever the data happens to sit.
    function lineChart(canvasId, dates, series, labelMode, thresholds, bands, yRange) {
      const el = document.getElementById(canvasId);
      if (!el) return;
      const seriesList = Array.isArray(series) ? series : [series];

      // Every series entirely null (e.g. a metric with no synced data at
      // all in the window) would otherwise render a blank, misleadingly
      // "did this break?" canvas — show an explicit empty state instead.
      const hasAnyData = seriesList.some(s => s.values.some(v => v !== null && v !== undefined));
      if (!hasAnyData) {
        el.replaceWith(Object.assign(document.createElement("div"), {
          className: "chart-no-data",
          textContent: "No data yet",
        }));
        return;
      }

      const annotations = {};
      // Bands first so they sit behind the threshold lines in z-order (both
      // are drawn behind the dataset lines by chartjs-plugin-annotation's
      // default drawTime, beforeDatasetsDraw).
      (bands || []).forEach((b, i) => { Object.assign(annotations, thresholdBand(b, i)); });
      (thresholds || []).forEach((t, i) => {
        Object.assign(annotations, thresholdLine(t, i));
      });

      const mainDatasets = seriesList.map(s => ({
        label: s.label,
        data: s.values,
        borderColor: s.hidden_line ? "transparent" : s.color,
        // fillColor overrides the default "derive from line color"
        // background — needed when a dataset exists purely to fill one
        // side of a shared line at a different color than the visible
        // line itself (see the body-composition chart's two-dataset
        // split-fill approach).
        backgroundColor: s.fillColor || (s.fill ? s.color + "26" : s.color + "33"),
        fill: s.fill || false,
        // pointColors: optional array parallel to s.values, one color per
        // point — overrides the single s.color for both the point and the
        // line segment leading into it (e.g. readiness state per day isn't
        // a single line color, it's a per-point category). Falls back to
        // the plain single-color line when absent.
        pointBackgroundColor: s.hidden_line ? "transparent" : "#0f1115",
        pointBorderColor: s.hidden_line
          ? "transparent"
          : (s.pointColors || s.values.map(() => s.color)),
        pointBorderWidth: 2,
        pointRadius: s.hidden_line ? 0 : POINT_RADIUS,
        pointHoverRadius: s.hidden_line ? 0 : POINT_HOVER_RADIUS,
        segment: s.pointColors
          ? { borderColor: ctx => s.pointColors[ctx.p1DataIndex] || s.color }
          : undefined,
        spanGaps: true,
        tension: 0.25,
      }));

      // A faint straight trend line per visible series: least-squares
      // linear regression over the whole series, layered on top of the
      // real data rather than replacing it — a single straight line
      // showing overall direction, not a per-point smoothing. Skipped for
      // hidden_line series (the body-composition chart's fill-only second
      // dataset — no line to fit) and for series with fewer than 2 usable
      // points (linearRegressionLine returns all-null in that case).
      const trendDatasets = seriesList
        .filter(s => !s.hidden_line)
        .map(s => {
          const regression = linearRegressionLine(s.values);
          if (!regression.some(v => v !== null)) return null;
          return {
            label: s.label + " (trend)",
            data: regression,
            borderColor: s.color + "80", // ~50% opacity — present but subordinate to the real line
            backgroundColor: "transparent",
            fill: false,
            pointRadius: 0,
            pointHoverRadius: 0,
            borderWidth: 2,
            borderDash: [2, 3],
            tension: 0, // straight line, not curved like the real-data line
          };
        })
        .filter(Boolean);

      new Chart(el, {
        type: "line",
        data: {
          labels: formatLabels(dates, labelMode),
          datasets: [...mainDatasets, ...trendDatasets],
        },
        options: {
          ...CHART_OPTIONS,
          plugins: { ...CHART_OPTIONS.plugins, annotation: { annotations } },
          scales: {
            ...CHART_OPTIONS.scales,
            y: { ...CHART_OPTIONS.scales.y, ...(yRange || dataDrivenYRange(seriesList)) },
          },
          // Consumed by thresholdGlyphPlugin's afterDraw, not a Chart.js
          // built-in option — see that plugin's registration above.
          thresholdGlyphs: thresholds || [],
        },
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
