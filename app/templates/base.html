<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyGymApp Dashboard{% endblock %}</title>
  <script src="/static/chart.umd.min.js"></script>
  <script src="/static/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #262b36;
      --text: #e6e8ec;
      --muted: #8b93a7;
      --accent: #5b9dff;
      --green: #3ecf7e;
      --yellow: #e0b23e;
      --red: #e05a5a;
      --gray: #4a5063;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    nav {
      display: flex;
      gap: 1.5rem;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover, nav a.active { color: var(--text); }
    nav .brand { color: var(--text); font-weight: 700; margin-right: auto; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
    h2 { font-size: 1.3rem; margin: 3rem 0 0.25rem; font-weight: 700; }
    h2.section-title {
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    h3 { font-size: 1.1rem; margin: 2rem 0 1rem; color: var(--muted); font-weight: 600; }
    .section-desc, .chart-desc {
      color: var(--muted);
      font-size: 0.88rem;
      margin: 0 0 1rem;
      max-width: 65ch;
    }
    .chart-desc { margin-bottom: 0.75rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .metric-label {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .metric-value {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0.25rem 0;
    }
    .metric-delta { font-size: 0.85rem; color: var(--muted); }
    .dot {
      display: inline-block;
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      margin-right: 0.4rem;
    }
    .dot.GREEN { background: var(--green); }
    .dot.YELLOW { background: var(--yellow); }
    .dot.RED { background: var(--red); }
    .dot.GRAY { background: var(--gray); }
    .alerts {
      list-style: none;
      padding: 0;
      margin: 1rem 0 0;
    }
    .alerts li {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--yellow);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 1rem;
    }
    .chart-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 0.35rem;
      text-align: center;
    }
    .chart-direction {
      font-size: 0.85rem;
      letter-spacing: -0.05em;
      color: var(--muted);
    }
    .chart-canvas-box {
      position: relative;
      flex: 1;
      /* Fixed minimum height on the canvas's own box, not the <canvas>
         element, since Chart.js with responsive:true resizes the canvas to
         fill its container — sizing only the canvas's height attribute gets
         overridden and ignored. */
      min-height: 280px;
    }
    .chart-canvas-box canvas {
      max-height: 100%;
    }
    .chart-no-data {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    a.row-link { color: var(--text); text-decoration: none; display: block; }
    .empty { color: var(--muted); font-style: italic; padding: 2rem; text-align: center; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">MyGymApp</span>
    <a href="/">Trends</a>
    <a href="/exercises">Exercises</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    // Shared chart helpers: ISO date -> "W20" (ISO week-of-year) or "Aug"
    // (abbreviated month name), plus a common lineChart() builder. Data
    // stays plain ISO dates end to end (from Python through the template);
    // this is purely a display-time relabeling of the x-axis.
    const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function isoWeekLabel(dateStr) {
      // ISO 8601 week number: the week containing the year's first Thursday is week 1.
      const d = new Date(dateStr + "T00:00:00Z");
      const dayNum = (d.getUTCDay() + 6) % 7; // Mon=0 .. Sun=6
      d.setUTCDate(d.getUTCDate() - dayNum + 3); // nearest Thursday
      const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
      const firstThursdayDay = (firstThursday.getUTCDay() + 6) % 7;
      firstThursday.setUTCDate(firstThursday.getUTCDate() - firstThursdayDay + 3);
      const weekNum = 1 + Math.round((d - firstThursday) / (7 * 86400000));
      return "W" + weekNum;
    }

    function monthLabel(dateStr) {
      const d = new Date(dateStr + "T00:00:00Z");
      return MONTH_ABBR[d.getUTCMonth()];
    }

    function formatLabels(dates, mode) {
      if (mode === "week") return dates.map(isoWeekLabel);
      if (mode === "month") return dates.map(monthLabel);
      return dates;
    }

    const CHART_OPTIONS = {
      responsive: true,
      // Without this, Chart.js locks to a 2:1 aspect ratio and ignores the
      // wrapper's actual height — the real cause of "chart is too flat"
      // regardless of how tall .chart-wrap is set. false lets the canvas
      // fill its container's height exactly.
      maintainAspectRatio: false,
      // Extra left padding so a threshold glyph anchored just outside the
      // y-axis (see thresholdAnnotations' xAdjust) has room to render
      // instead of being clipped by the canvas edge.
      layout: { padding: { left: 16 } },
      // Legend is redundant now that every chart has its own <h4> title
      // above it (single-series charts) or an explicit dataset label already
      // conveyed by the section around it — dropped in favor of that,
      // rather than a legend duplicating the same name inside the canvas.
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b93a7" }, grid: { color: "#262b36" } },
        y: { ticks: { color: "#8b93a7" }, grid: { color: "#262b36" } },
      },
    };

    // Points need to read as distinct dots, not just a kink in the line —
    // larger radius + a darker/lighter point color than the line itself
    // (not just the same color at full opacity) so the eye catches
    // individual data points even on a dense series.
    const POINT_RADIUS = 4;
    const POINT_HOVER_RADIUS = 6;

    // Reference-line glyphs, plain Unicode geometric shapes (not emoji —
    // these have no emoji presentation form, so they render as text glyphs
    // in every font/OS rather than a colored pictograph). △ (outline) for a
    // "warning" line, ▲ (filled) for a "danger" line — same vocabulary as
    // the semaphore dots elsewhere, just two severities since a reference
    // line is a single fixed cutoff, not a live current-value state.
    const THRESHOLD_GLYPH = { warning: "△", danger: "▲" };

    // Builds the two chartjs-plugin-annotation entries for one threshold:
    // { value, severity: "warning"|"danger", label }. The glyph sits like a
    // y-axis tick — outside the plotting area, to the left of the axis, via
    // a negative xAdjust — while the description text stays on the line
    // itself inside the chart.
    function thresholdAnnotations(threshold, index) {
      const color = threshold.severity === "danger" ? "#e05a5a" : "#e0b23e";
      const line = {
        type: "line",
        yMin: threshold.value,
        yMax: threshold.value,
        borderColor: color,
        borderWidth: 1,
        borderDash: [5, 4],
        label: {
          display: true,
          content: threshold.label,
          position: "start",
          backgroundColor: "transparent",
          color: color,
          font: { size: 10, weight: "normal" },
          padding: 0,
          yAdjust: -8,
        },
      };
      const glyph = {
        type: "label",
        xScaleID: "x",
        yScaleID: "y",
        // The x-axis is a category scale (week/date labels), so "the first
        // category" is what anchors this at the left edge — xValue: 0 means
        // "index 0 of the labels array", not a numeric x position.
        xValue: 0,
        yValue: threshold.value,
        content: THRESHOLD_GLYPH[threshold.severity],
        color: color,
        font: { size: 12 },
        // Sits just left of the y-axis, like an axis tick, not inside the
        // plotting area where the line's own text label already lives.
        // clip: false is required for that — by default the plugin clips
        // any annotation to the chart area, which silently hides anything
        // pushed outside it via xAdjust.
        xAdjust: -20,
        clip: false,
        backgroundColor: "transparent",
      };
      return { [`thresholdLine${index}`]: line, [`thresholdGlyph${index}`]: glyph };
    }

    // labelMode: "week" -> "W20", "month" -> "Aug", anything else -> raw ISO date.
    // series: a single {label, values, color, fill?} or an array of them for
    // a multi-dataset chart (see the two-series body-composition chart).
    // fill: omitted/false for a plain line, "start"/"end" to shade the area
    // between the line and the chart's bottom/top edge (Chart.js fill modes).
    // thresholds: optional array of {value, severity, label} reference lines
    // (see docs/sync-ingestion/ANALYSIS_SPEC.md and the sources cited in
    // dashboard.html's THRESHOLDS table for where each cutoff comes from).
    function lineChart(canvasId, dates, series, labelMode, thresholds) {
      const el = document.getElementById(canvasId);
      if (!el) return;
      const seriesList = Array.isArray(series) ? series : [series];

      // Every series entirely null (e.g. a metric with no synced data at
      // all in the window) would otherwise render a blank, misleadingly
      // "did this break?" canvas — show an explicit empty state instead.
      const hasAnyData = seriesList.some(s => s.values.some(v => v !== null && v !== undefined));
      if (!hasAnyData) {
        el.replaceWith(Object.assign(document.createElement("div"), {
          className: "chart-no-data",
          textContent: "No data yet",
        }));
        return;
      }

      const annotations = {};
      (thresholds || []).forEach((t, i) => {
        Object.assign(annotations, thresholdAnnotations(t, i));
      });

      new Chart(el, {
        type: "line",
        data: {
          labels: formatLabels(dates, labelMode),
          datasets: seriesList.map(s => ({
            label: s.label,
            data: s.values,
            borderColor: s.color,
            backgroundColor: s.fill ? s.color + "26" : s.color + "33",
            fill: s.fill || false,
            pointBackgroundColor: "#0f1115",
            pointBorderColor: s.color,
            pointBorderWidth: 2,
            pointRadius: POINT_RADIUS,
            pointHoverRadius: POINT_HOVER_RADIUS,
            spanGaps: true,
            tension: 0.25,
          })),
        },
        options: {
          ...CHART_OPTIONS,
          plugins: { ...CHART_OPTIONS.plugins, annotation: { annotations } },
        },
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
