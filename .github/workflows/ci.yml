name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # Audits pyproject.toml's declared deps, not the runner's own
          # pip/setuptools — those aren't this project's dependencies.
          #
          # --ignore-vuln PYSEC-2026-3447: setuptools<83 sdist-build MANIFEST.in
          # glob-matching issue (affects `python -m build --sdist` only — this
          # project never builds/publishes an sdist, only deploys via Docker/
          # direct run). neurokit2==0.2.13 pins `setuptools<82` as a runtime
          # dependency, which blocks upgrading past this CVE's fixed version
          # (83.0.0) entirely — verified 2026-08 that no compatible neurokit2
          # release exists yet. Re-check this exclusion whenever neurokit2 is
          # upgraded; drop it once a version without the setuptools pin ships.
          pip-audit . --ignore-vuln PYSEC-2026-3447
