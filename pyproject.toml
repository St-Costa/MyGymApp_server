[project]
name = "mygymapp-sync-server"
version = "0.1.0"
description = "Self-hosted ingestion server for MyGymApp workout sessions, reachable only over Tailscale."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # app/ecg_analysis.py's advanced-metrics tier (DFA-alpha1, frequency-
    # domain/nonlinear HRV, signal-quality cross-check): see
    # docs/sync-ingestion/ECG_ADVANCED_ANALYSIS.md for why these two and not
    # vital-sqi (broken on PyPI as of this writing — its hrv-analysis
    # dependency imports an astropy API removed upstream, and pinning around
    # it collides with numpy 1.x/2.x across the rest of the tree).
    "neurokit2>=0.2.13",
    "py-ecg-detectors>=1.3.5",
    # Full-page screenshot of the dashboard (app/screenshot.py), used both by
    # the /weekly-report preview page and by generate_report.py's on-disk
    # weekly report save — a production dependency since the latter is meant
    # to run unattended from an external cron job. Needs `playwright install
    # --with-deps chromium` too (see Dockerfile); pulls in a real Chromium at
    # image-build time, not just this package.
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# Non-.py assets for the server-rendered dashboard (app/gui.py) — setuptools
# doesn't include these by default, so `pip install .` (used by the
# Dockerfile) would silently ship a package missing its templates/static
# files without this.
app = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
